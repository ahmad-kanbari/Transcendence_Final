<!DOCTYPE html>
<html lang="en" dir="ltr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Pong Game</title>
        
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
        <script src="https://cdn.tailwindcss.com"></script>
        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        colors: {
                            'cyber-pink': '#FF2A6D',
                            'cyber-blue': '#05D9E8',
                            'cyber-purple': '#9D4EDD',
                            'cyber-yellow': '#F9C80E',
                            'cyber-green': '#2DE2E6',
                            'cyber-dark': '#0F0F1B',
                            'cyber-darker': '#070718',
                            'cyber-black': '#030303',
                        },
                        fontFamily: {
                            'cyber': ['Orbitron', 'sans-serif'],
                            'body': ['Roboto', 'sans-serif'],
                        },
                        boxShadow: {
                            'neon-pink': '0 0 5px #FF2A6D, 0 0 10px #FF2A6D',
                            'neon-blue': '0 0 5px #05D9E8, 0 0 10px #05D9E8',
                            'neon-purple': '0 0 5px #9D4EDD, 0 0 10px #9D4EDD',
                            'neon-yellow': '0 0 5px #F9C80E, 0 0 10px #F9C80E',
                            'neon-green': '0 0 5px #2DE2E6, 0 0 10px #2DE2E6',
                        }
                    }
                }
            }
        </script>
        <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="src/css/index.css">
        <link rel="stylesheet" href="src/css/home.css">
        <link rel="stylesheet" href="src/css/game.css">
        <link rel="stylesheet" href="src/css/login.css">
        <link rel="stylesheet" href="src/css/profile.css">
        <link rel="stylesheet" href="src/css/accessibility.css">
    </head>

    <body class="font-body bg-cyber-dark">
        <header class="cyber-navbar navbar navbar-expand-lg fixed-top navbar-dark">
            <div class="container">
                <!-- Logo -->
                <a id="logo" class="logo flex items-center" href="/" aria-label="Home">
                    <span class="logo-text font-cyber text-cyber-blue text-xl tracking-widest animate-glow" data-i18n="general.appName">PING PONG</span>
                </a>
                
                <!-- Main Navigation - Always Visible on Desktop -->
                <div class="hidden lg:flex flex-grow justify-center">
                    <ul class="navbar-nav flex space-x-4">
                        <li class="nav-item">
                            <a href="/" class="cyber-link nav-link px-4 py-2 text-cyber-blue hover:text-cyber-pink" id="homeNavBtn" data-i18n="navigation.home">Home</a>
                        </li>
                        <li class="nav-item">
                            <a href="/game" class="cyber-link nav-link px-4 py-2 text-cyber-green hover:text-cyber-pink" id="gameNavBtn" data-i18n="navigation.game">Game</a>
                        </li>
                        <li class="nav-item">
                            <a href="/profile" class="cyber-link nav-link px-4 py-2 text-cyber-purple hover:text-cyber-pink" id="profilePageBtn" data-i18n="navigation.profile">Profile</a>
                        </li>
                        <li class="nav-item">
                            <a href="/login" class="cyber-link nav-link px-4 py-2 text-cyber-yellow hover:text-cyber-pink" id="loginNavBtn" data-i18n="navigation.login">Login</a>
                        </li>
                    </ul>
                </div>
                
                <!-- Mobile Menu Button -->
                <button class="navbar-toggler border-cyber-blue focus:outline-none focus:ring-2 focus:ring-cyber-blue lg:hidden" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                
                <!-- User Profile Dropdown -->
                <div class="hidden lg:block">
                    <div id="loginDropdown" class="nav-item dropdown profile-dropdown">
                        <div class="user-profile flex items-center justify-center px-4 py-2 mx-1 cursor-pointer hover:bg-cyber-darker rounded" id="userProfileDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                            <img id="loggedInUserImg" class="header-avatar rounded-full w-8 h-8 border border-cyber-blue shadow-neon-blue mr-2" src="src/assets/icons/avatar.svg" alt="User">
                            <span id="loggedInUsername" class="user-name text-white"></span>
                        </div>
                        <ul class="dropdown-menu border border-cyber-blue bg-cyber-darker rounded-md shadow-neon-blue dropdown-menu-end profile-dropdown-menu" aria-labelledby="userProfileDropdown">
                            <li>
                                <a class="dropdown-item text-cyber-blue hover:bg-cyber-blue hover:text-cyber-darker transition-all duration-300 flex items-center py-2 px-4" href="/profile" id="profileNavBtn">
                                    <i class="bi bi-person-circle mr-2" aria-hidden="true"></i>
                                    <span data-i18n="navigation.profile">Profile</span>
                                </a>
                            </li>
                            <li>
                                <a class="dropdown-item text-cyber-pink hover:bg-cyber-pink hover:text-cyber-darker transition-all duration-300 flex items-center py-2 px-4" href="#" id="logoutBtn">
                                    <i class="bi bi-box-arrow-right mr-2" aria-hidden="true"></i>
                                    <span data-i18n="navigation.logout">Logout</span>
                                </a>
                            </li>
                        </ul>
                    </div>
                </div>
                
                <!-- Mobile Navigation Menu - Shown when toggled -->
                <div class="collapse navbar-collapse mt-2 lg:hidden w-full" id="navbarNav">
                    <ul class="navbar-nav bg-cyber-darker bg-opacity-90 w-full rounded-md border border-cyber-blue p-4 space-y-2 shadow-neon-blue">
                        <li class="nav-item">
                            <a href="/" class="cyber-link nav-link flex items-center p-3 border-b border-cyber-blue text-white hover:text-cyber-blue" id="homeNavBtnMobile">
                                <i class="bi bi-house-door mr-2 text-cyber-blue"></i>
                                <span data-i18n="navigation.home">Home</span>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a href="/game" class="cyber-link nav-link flex items-center p-3 border-b border-cyber-blue text-white hover:text-cyber-green" id="gameNavBtnMobile">
                                <i class="bi bi-controller mr-2 text-cyber-green"></i>
                                <span data-i18n="navigation.game">Game</span>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a href="/profile" class="cyber-link nav-link flex items-center p-3 border-b border-cyber-blue text-white hover:text-cyber-purple" id="profileNavBtnMobile">
                                <i class="bi bi-person mr-2 text-cyber-purple"></i>
                                <span data-i18n="navigation.profile">Profile</span>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a href="/login" class="cyber-link nav-link flex items-center p-3 text-white hover:text-cyber-yellow" id="loginNavBtnMobile">
                                <i class="bi bi-box-arrow-in-right mr-2 text-cyber-yellow"></i>
                                <span data-i18n="navigation.login">Login</span>
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </header> 
        
        <div class="video-background">
            <div class="video-overlay cyber-grid-bg"></div>
            <video autoplay muted loop preload="auto" style="background: #070718;"> 
                <source src="src/assets/videos/vid.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>
        
        <main id="App" class="main-container px-4">
        </main>
        
        <footer class="py-3 mt-5 bg-cyber-darker bg-opacity-80 border-t border-cyber-blue">
            <div class="container text-center">
                <p class="font-cyber text-cyber-blue text-sm tracking-wide mb-0">&copy; 2025 <span class="cyber-glitch">ft_transcendence</span>. All rights reserved.</p>
            </div>
        </footer>
        
        <div id="spinnerContainer" class="spinner-container d-none">
            <div class="spinner-content">
                <div class="spinner border-4 border-cyber-darker border-t-cyber-blue shadow-neon-blue w-12 h-12"></div>
            </div>
        </div>
        
        <div id="toastComponent" class="toast-component d-none border-l-4 border-cyber-pink bg-cyber-darker bg-opacity-90 rounded-r shadow-neon-pink">
            <div class="toast-icon-container text-cyber-pink">
                <i class="bi bi-exclamation-triangle-fill toast-icon"></i>
            </div>
            <div class="toast-text">
                <p class="toast-title font-cyber text-cyber-pink" id="toastTitle"></p>
                <p class="toast-message text-white" id="toastMsg"></p>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
        
        <script>
            WebSocket = function() { 
                return { 
                    send: function(){}, 
                    close: function(){} 
                }; 
            };
        </script>
        
        <script src="dist/bundle.js"></script>
    </body>
</html>
