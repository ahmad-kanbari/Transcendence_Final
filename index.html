        <style>
            /* Matrix Background Effect */
            .matrix-bg::before {
                content: '';
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: linear-gradient(180deg, transparent, rgba(5, 217, 232, 0.1) 50%, transparent);
                background-size: 2px 100px;
                animation: matrix 20s linear infinite;
                pointer-events: none;
                z-index: -1;
            }
    
            /* Grid Background */
            .cyber-grid-bg {
                background-image: 
                    linear-gradient(rgba(5, 217, 232, 0.1) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(5, 217, 232, 0.1) 1px, transparent 1px);
                background-size: 20px 20px;
            }
    
            /* Glitch Effect */
            .cyber-glitch {
                position: relative;
            }
    
            .cyber-glitch::before,
            .cyber-glitch::after {
                content: attr(data-text);
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
            }
    
            .cyber-glitch::before {
                animation: glitch 0.3s infinite;
                color: #FF2A6D;
                z-index: -1;
            }
    
            .cyber-glitch::after {
                animation: glitch 0.3s infinite reverse;
                color: #05D9E8;
                z-index: -2;
            }
    
            /* Custom Scrollbar */
            ::-webkit-scrollbar {
                width: 8px;
            }
    
            ::-webkit-scrollbar-track {
                background: #070718;
                border-radius: 4px;
            }
    
            ::-webkit-scrollbar-thumb {
                background: linear-gradient(45deg, #FF2A6D, #05D9E8);
                border-radius: 4px;
            }
    
            ::-webkit-scrollbar-thumb:hover {
                background: linear-gradient(45deg, #05D9E8, #FF2A6D);
            }
    
            /* Notification Badge Animation */
            .notification-badge {
                animation: glow 1s ease-in-out infinite alternate;
            }
    
            /* Hide body until authenticated */
            body.pre-auth {
                visibility: hidden;
                opacity: 0;
            }
    
            body.authenticated {
                visibility: visible;
                opacity: 1;
                transition: opacity 0.5s ease-in-out;
            }
    
            /* Search Results Dropdown */
            #userSearchResults {
                backdrop-filter: blur(10px);
                border: 1px solid rgba(5, 217, 232, 0.3);
            }
    
            /* Toast Notification Enhancement */
            .toast-notification {
                backdrop-filter: blur(10px);
                border: 1px solid rgba(5, 217, 232, 0.3);
            }
        </style>
        <style>
            /* Accessibility Cyberpunk Styling */
            .skip-to-content {

            .accessibility-nav {

                /* Responsive adjustments */
                @media (min-width: 768px) {
                    top: 80px;
                    right: 16px;
                    bottom: auto;
                }
            }
            
            .accessibility-nav button {
                background-color: #0F0F1B;
                color: #05D9E8;
                border: 1px solid #05D9E8;
                padding: 5px 10px;
                border-radius: 4px;
                font-family: 'Orbitron', sans-serif;
                transition: all 0.3s;
                display: flex;
                align-items: center;
                justify-content: center;
                min-width: 40px;
                min-height: 40px; /* Larger touch target for mobile */
            }
            
            .accessibility-nav button:hover {
                background-color: #05D9E8;
                color: #070718;
                box-shadow: 0 0 5px #05D9E8, 0 0 10px #05D9E8;
            }
            
            .accessibility-nav button.active {
                background-color: #05D9E8;
                color: #070718;
                box-shadow: 0 0 5px #05D9E8, 0 0 10px #05D9E8;
            }
            
            .text-size-controls {
                display: flex;
                gap: 5px;
                justify-content: center;
            }
            
            .text-size-controls button {
                width: 40px;
                height: 40px;
            }
            
            /* Collapsed version of accessibility controls for mobile */
            .accessibility-toggle {
                position: fixed;
                bottom: 16px;
                right: 16px;
                width: 50px;
                height: 50px;
                border-radius: 25px;
                background-color: #070718;
                border: 2px solid #05D9E8;
                box-shadow: 0 0 5px #05D9E8, 0 0 10px #05D9E8;
                color: #05D9E8;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 20px;
                z-index: 999;
                cursor: pointer;
                transition: all 0.3s ease;
            }
            
            .accessibility-toggle:hover {
                transform: scale(1.05);
            }
            
            /* When accessibility panel is expanded */
            .accessibility-expanded {
                display: flex !important;
            }
            
            .sr-only {
                position: absolute;
                width: 1px;
                height: 1px;
                padding: 0;
                margin: -1px;
                overflow: hidden;
                clip: rect(0, 0, 0, 0);
                white-space: nowrap;
                border-width: 0;
            }
            
            /* High Contrast Mode */
            body.high-contrast {
                background-color: #000000;
                color: #ffffff;
            }
            
            .high-contrast .navbar,
            .high-contrast .footer {
                background-color: #000000 !important;

            }
            
            .high-contrast a:hover,

        <script>
            // Accessibility Controls
            document.addEventListener('DOMContentLoaded', function() {
                // Initialize accessibility options
                let accessibilityOptions = localStorage.getItem('accessibility') 
                    ? JSON.parse(localStorage.getItem('accessibility'))
                    : {
                        highContrast: false,
                        textSize: 'medium'
                    };
                
                // Apply saved settings
                applyAccessibilitySettings();
                
                // Mobile Menu Toggle
                const mobileMenuButton = document.getElementById('mobileMenuButton');
                const navbarNav = document.getElementById('navbarNav');
                
                mobileMenuButton.addEventListener('click', function() {
                    navbarNav.classList.toggle('hidden');
                });
                
                // User profile dropdown toggle
                const userProfileDropdown = document.getElementById('userProfileDropdown');
                const dropdownMenu = document.querySelector('.dropdown-menu');
                
                if (userProfileDropdown && dropdownMenu) {
                    userProfileDropdown.addEventListener('click', function() {
                        dropdownMenu.classList.toggle('hidden');
                    });
                    
                    // Hide dropdown when clicking outside
                    document.addEventListener('click', function(event) {
                        if (!dropdownMenu.contains(event.target) && !userProfileDropdown.contains(event.target)) {
                            dropdownMenu.classList.add('hidden');
                        }
                    });
                }
                
                // Accessibility Toggle for Mobile
                const accessibilityToggle = document.getElementById('accessibilityToggle');
                const accessibilityControls = document.getElementById('accessibilityControls');
                
                accessibilityToggle.addEventListener('click', function() {
                    accessibilityControls.classList.toggle('hidden');
                    accessibilityControls.classList.toggle('accessibility-expanded');
                });
                
                // Hide accessibility controls when clicking elsewhere (mobile)
                document.addEventListener('click', function(event) {
                    if (!accessibilityControls.contains(event.target) && 
                        !accessibilityToggle.contains(event.target) && 
                        accessibilityControls.classList.contains('accessibility-expanded')) {
                        accessibilityControls.classList.add('hidden');
                        accessibilityControls.classList.remove('accessibility-expanded');
                    }
                });
                
                // Language selector functionality 
                const languageToggle = document.getElementById('languageToggle');
                const languageMenu = document.getElementById('languageMenu');
                const currentLang = document.querySelector('.current-lang');
                const languageOptions = document.querySelectorAll('.lang-option');
                
                // Initialize with current language from localization service if available,
                // otherwise use saved preference or default to 'en'
                let initialLanguage = 'en';
                
                
                // Try to get language from localization service
                if (window.localization && window.localization.currentLanguage) {
                    initialLanguage = window.localization.currentLanguage;
                } else {
                    // Fallback to localStorage
                    initialLanguage = localStorage.getItem('selectedLanguage') || 
                                      localStorage.getItem('language') || 'en';
                }
                
                // Update the display
                currentLang.textContent = initialLanguage.toUpperCase();
                
                // Mark the currently active language
                document.querySelector(`.lang-option[data-lang="${initialLanguage}"]`)?.classList.add('active');
                
                // Toggle language dropdown
                languageToggle.addEventListener('click', function() {
                    languageMenu.classList.toggle('hidden');
                    languageMenu.classList.toggle('show');
                    languageToggle.setAttribute('aria-expanded', languageMenu.classList.contains('show').toString());
                });
                
                // Handle language selection
                languageOptions.forEach(option => {
                    option.addEventListener('click', function() {
                        const lang = this.getAttribute('data-lang');
                        
                        // Update current language display
                        currentLang.textContent = lang.toUpperCase();
                        
                        // Update active state
                        languageOptions.forEach(opt => opt.classList.remove('active'));
                        this.classList.add('active');
                        
                        // Hide dropdown
                        languageMenu.classList.add('hidden');
                        languageMenu.classList.remove('show');
                        languageToggle.setAttribute('aria-expanded', 'false');
                        
                        // Use the localization service if available
                        if (window.localization && typeof window.localization.setLanguage === 'function') {
                            window.localization.setLanguage(lang);
                        } else {
                            // Fallback: just save to localStorage and trigger event
                            localStorage.setItem('selectedLanguage', lang);
                            localStorage.setItem('language', lang); // for compatibility
                            
                            // Update document direction for RTL languages
                            if (lang === 'ar') {
                                document.documentElement.dir = 'rtl';
                                document.documentElement.lang = lang;
                                document.body.classList.add('rtl');
                            } else {
                                document.documentElement.dir = 'ltr';
                                document.documentElement.lang = lang;
                                document.body.classList.remove('rtl');
                            }
                            
                            // Trigger language change event for the i18n system
                            const event = new CustomEvent('languageChanged', { 
                                detail: { 
                                    language: lang,
                                    isRTL: lang === 'ar'
                                } 
                            });
                            document.dispatchEvent(event);

                            //need to be checked
                            location.reload();
                            // localization.updatePageContent();
                            // window.reload(); 
                        }
                    });
                });
                
                // Close language dropdown when clicking outside
                document.addEventListener('click', function(event) {
                    if (!languageMenu.contains(event.target) && 
                        !languageToggle.contains(event.target) && 
                        languageMenu.classList.contains('show')) {
                        languageMenu.classList.add('hidden');
                        languageMenu.classList.remove('show');
                        languageToggle.setAttribute('aria-expanded', 'false');
                    }
                });
                
                // Listen for language changes from other parts of the application
                document.addEventListener('languageChanged', function(event) {
                    if (event.detail && event.detail.language) {
                        // Update language display
                        currentLang.textContent = event.detail.language.toUpperCase();
                        
                        // Update active state
                        languageOptions.forEach(option => {
                            const lang = option.getAttribute('data-lang');
                            option.classList.toggle('active', lang === event.detail.language);
                        });
                        
                        // Apply RTL if needed
                        if (event.detail.isRTL) {
                            document.documentElement.dir = 'rtl';
                            document.body.classList.add('rtl');
                           
                            
                            // Adjust accessibility panel position for RTL
                            if (window.innerWidth >= 768) { // md breakpoint
                                accessibilityControls.style.right = 'auto';
                                accessibilityControls.style.left = '16px';
                            }
                        } else {
                            document.documentElement.dir = 'ltr';
                            document.body.classList.remove('rtl');
                            
                            // Reset accessibility panel position
                            if (window.innerWidth >= 768) { // md breakpoint
                                accessibilityControls.style.left = 'auto';
                                accessibilityControls.style.right = '16px';
                            }
                        }

                                                                 
                    }
               
                });
                
                // Adjust for responsive layouts
                function handleResponsiveLayout() {
                    // if (window.innerWidth >= 768) { // md breakpoint
                    //     accessibilityControls.classList.remove('hidden');
                    //     accessibilityControls.classList.remove('accessibility-expanded');
                    // } else {
                        if (!accessibilityControls.classList.contains('accessibility-expanded')) {
                            accessibilityControls.classList.add('hidden');
                        }
                    // }
                }
                
                // Initial call
                handleResponsiveLayout();
                
                // Listen for window resize
                window.addEventListener('resize', handleResponsiveLayout);
                
                // High Contrast Toggle
                const highContrastToggle = document.getElementById('highContrastToggle');
                highContrastToggle.addEventListener('click', function() {
                    accessibilityOptions.highContrast = !accessibilityOptions.highContrast;
                    highContrastToggle.setAttribute('aria-pressed', accessibilityOptions.highContrast.toString());
                    if (accessibilityOptions.highContrast) {
                        highContrastToggle.classList.add('active');
                    } else {
                        highContrastToggle.classList.remove('active');
                    }
                    applyAccessibilitySettings();
                    saveAccessibilitySettings();
                });
                
                // Text Size Controls
                const smallTextBtn = document.getElementById('smallTextBtn');
                const mediumTextBtn = document.getElementById('mediumTextBtn');
                const largeTextBtn = document.getElementById('largeTextBtn');
                
                smallTextBtn.addEventListener('click', function() {
                    accessibilityOptions.textSize = 'small';
                    updateTextSizeButtons(smallTextBtn);
                    applyAccessibilitySettings();
                    saveAccessibilitySettings();
                });
                
                mediumTextBtn.addEventListener('click', function() {
                    accessibilityOptions.textSize = 'medium';
                    updateTextSizeButtons(mediumTextBtn);
                    applyAccessibilitySettings();
                    saveAccessibilitySettings();
                });
                
                largeTextBtn.addEventListener('click', function() {
                    accessibilityOptions.textSize = 'large';
                    updateTextSizeButtons(largeTextBtn);
                    applyAccessibilitySettings();
                    saveAccessibilitySettings();
                });
                
                // Initialize active states
                if (accessibilityOptions.highContrast) {
                    highContrastToggle.classList.add('active');
                    highContrastToggle.setAttribute('aria-pressed', 'true');
                }
                
                // Initialize text size active button
                switch (accessibilityOptions.textSize) {
                    case 'small':
                        updateTextSizeButtons(smallTextBtn);
                        break;
                    case 'medium':
                        updateTextSizeButtons(mediumTextBtn);
                        break;
                    case 'large':
                        updateTextSizeButtons(largeTextBtn);
                        break;
                }
                
                // Helper Functions
                function updateTextSizeButtons(activeBtn) {
                    [smallTextBtn, mediumTextBtn, largeTextBtn].forEach(btn => {
                        btn.classList.remove('active');
                    });
                    activeBtn.classList.add('active');
                }
                
                function applyAccessibilitySettings() {
                    // Apply high contrast mode
                    if (accessibilityOptions.highContrast) {
                        document.body.classList.add('high-contrast');
                    } else {
                        document.body.classList.remove('high-contrast');
                    }
                    
                    // Apply text size
                    document.body.classList.remove('text-size-small', 'text-size-medium', 'text-size-large');
                    document.body.classList.add(`text-size-${accessibilityOptions.textSize}`);
                }
                
                function saveAccessibilitySettings() {
                    localStorage.setItem('accessibility', JSON.stringify(accessibilityOptions));
                }
                
                // Add keyboard support for UI components
                document.querySelectorAll('[role="button"]:not(button)').forEach(el => {
                    el.addEventListener('keydown', (e) => {
                        // Activate on Space or Enter key
                        if (e.key === ' ' || e.key === 'Enter') {
                            e.preventDefault();
                            el.click();
                        }
                    });
                });
            });
        </script>

        /* Online status indicator */
        .status-indicator {

            content: '';

            bottom: 0; right: 0;
            width: 12px; height: 12px;
            border-radius: 50%;
            border: 2px solid #070718;
        }
        .status-online::after {
            background: #2DE2E6;
            box-shadow: 0 0 5px #2DE2E6;
        }
        .status-offline::after {
            background: #666;
        }

        /* High contrast mode for accessibility */
        body.high-contrast {
            background-color: #000000;
            color: #ffffff;
        }
        .high-contrast .bg-cyber-darker { background-color: #000000 !important; }
        .high-contrast .bg-cyber-dark { background-color: #222222 !important; }
        .high-contrast .border-cyber-blue { border-color: #ffffff !important; }
        .high-contrast .text-cyber-blue { color: #ffffff !important; }

        /* Text size adjustments for accessibility */
        body.text-size-small { font-size: 0.9rem; }
        body.text-size-medium { font-size: 1rem; }
        body.text-size-large { font-size: 1.2rem; }
        body.text-size-large h1 { font-size: 2.5rem; }
        body.text-size-large h2 { font-size: 2rem; }
        body.text-size-large h3 { font-size: 1.75rem; }

        /* Focus indicators for keyboard navigation */
        button:focus, input:focus, [tabindex]:focus {
            outline: 2px solid #05D9E8;
            outline-offset: 2px;
        }

        .connection-status {

            }
    </style>
