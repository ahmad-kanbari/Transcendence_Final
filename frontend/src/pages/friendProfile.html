    <!-- Scripts -->
    <script>
        // Friend Profile Class
        class FriendProfile {
            constructor() {
                this.friendId = null;
                this.friendData = null;
                this.relationshipStatus = null;
                this.baseURL = 'http://localhost:3000';
                this.init();
            }
            
            init() {
                // Get friend ID from URL parameters
                const urlParams = new URLSearchParams(window.location.search);
                this.friendId = urlParams.get('userId');
                
                if (!this.friendId) {
                    this.showError('No user ID provided');
                    return;
                }
                
                this.setupEventListeners();
                this.loadFriendProfile();
            }
            
            setupEventListeners() {
                // Back button
                document.getElementById('backToChatBtn').addEventListener('click', () => {
                    this.goBackToChat();
                });
                
                // Action buttons
                document.getElementById('addFriendBtn').addEventListener('click', () => {
                    this.sendFriendRequest();
                });
                
                document.getElementById('removeFriendBtn').addEventListener('click', () => {
                    this.removeFriend();
                });
                
                document.getElementById('chatBtn').addEventListener('click', () => {
                    this.startChat();
                });
                
                document.getElementById('blockBtn').addEventListener('click', () => {
                    this.blockUser();
                });
                
                document.getElementById('unblockBtn').addEventListener('click', () => {
                    this.unblockUser();
                });
                
                // Modal buttons
                document.getElementById('showFriendDetailedStatsBtn').addEventListener('click', () => {
                    this.showDetailedStats();
                });
                
                document.getElementById('showFriendMatchHistoryBtn').addEventListener('click', () => {
                    this.showMatchHistory();
                });
                
                // Close modals
                document.getElementById('closeFriendDetailedStatsBtn').addEventListener('click', () => {
                    document.getElementById('friendDetailedStatsModal').classList.add('hidden');
                });
                
                document.getElementById('closeFriendMatchHistoryBtn').addEventListener('click', () => {
                    document.getElementById('friendMatchHistoryModal').classList.add('hidden');
                });
            }
            
            async loadFriendProfile() {
                try {
                    // Load friend data
                    const response = await fetch(`${this.baseURL}/users/${this.friendId}`, {
                        credentials: 'include'
                    });
                    
                    if (!response.ok) {
                        throw new Error('Failed to load friend profile');
                    }
                    
                    this.friendData = await response.json();
                    
                    // Load relationship status
                    await this.loadRelationshipStatus();
                    
                    // Populate the UI
                    this.populateProfile();
                    
                } catch (error) {
                    console.error('Error loading friend profile:', error);
                    this.showError('Failed to load friend profile');
                }
            }
            
            async loadRelationshipStatus() {
                try {
                    // Check if user is blocked
                    const blockedResponse = await fetch(`${this.baseURL}/users/blocks`, {
                        credentials: 'include'
                    });
                    
                    if (blockedResponse.ok) {
                        const blockedUsers = await blockedResponse.json();
                        const isBlocked = blockedUsers.some(user => user.id.toString() === this.friendId);
                        
                        if (isBlocked) {
                            this.relationshipStatus = 'blocked';
                            return;
                        }
                    }
                    
                    // Check friendship status
                    const friendsResponse = await fetch(`${this.baseURL}/users/friends`, {
                        credentials: 'include'
                    });
                    
                    if (friendsResponse.ok) {
                        const friendsData = await friendsResponse.json();
                        
                        // Check if already friends
                        const isFriend = friendsData.some(friend => friend.userId.toString() === this.friendId);
                        if (isFriend) {
                            this.relationshipStatus = 'friend';
                            return;
                        }
                        
                        // Check pending requests
                        const pendingResponse = await fetch(`${this.baseURL}/users/friends/pending`, {
                            credentials: 'include'
                        });
                        
                        if (pendingResponse.ok) {
                            const pendingData = await pendingResponse.json();
                            const hasPendingRequest = pendingData.some(req => 
                                req.senderId.toString() === this.friendId || 
                                req.receiverId.toString() === this.friendId
                            );
                            
                            if (hasPendingRequest) {
                                this.relationshipStatus = 'pending';
                                return;
                            }
                        }
                    }
                    
                    this.relationshipStatus = 'none';
                    
                } catch (error) {
                    console.error('Error loading relationship status:', error);
                    this.relationshipStatus = 'none';
                }
            }
            
            populateProfile() {
                // Basic profile information
                document.getElementById('friendProfileUsername').textContent = this.friendData.username || 'Unknown User';
                document.getElementById('friendDisplayName').textContent = this.friendData.username || 'Unknown User';
                
                // Profile picture
                const profileImg = document.getElementById('friendProfileAvatar');
                if (this.friendData.profile_picture) {
                    profileImg.src = this.friendData.profile_picture;
                } else {
                    profileImg.src = 'src/assets/icons/user.png';
                }
                
                // Online status
                this.updateOnlineStatus();
                
                // Member since
                const memberSince = new Date(this.friendData.created_at).toLocaleDateString();
                document.getElementById('friendMemberSince').textContent = memberSince;
                
                // Last seen with online status
                this.updateLastSeenStatus();
                
                // Stats
                document.getElementById('friendStatsTotalGames').textContent = this.friendData.stats?.total_games || 0;
                document.getElementById('friendStatsWins').textContent = this.friendData.stats?.wins || 0;
                document.getElementById('friendStatsLosses').textContent = this.friendData.stats?.losses || 0;
                
                const winRate = this.friendData.stats?.total_games > 0 ? 
                    Math.round((this.friendData.stats.wins / this.friendData.stats.total_games) * 100) : 0;
                document.getElementById('friendStatsWinRate').textContent = winRate + '%';
                
                // Update relationship status and buttons
                this.updateRelationshipDisplay();
            }
            
            updateOnlineStatus() {
                const isOnline = this.friendData.isOnline || false;
                
                // Update avatar indicator
                const indicator = document.getElementById('onlineStatusIndicator');
                const innerDot = indicator.querySelector('div');
                
                if (isOnline) {
                    innerDot.className = 'w-3 h-3 rounded-full online-indicator';
                    indicator.style.display = 'flex';
                } else {
                    innerDot.className = 'w-3 h-3 rounded-full offline-indicator';
                    indicator.style.display = 'flex';
                }
                
                // Update text status
                const statusText = document.getElementById('onlineStatusText');
                const statusLabel = document.getElementById('onlineStatusLabel');
                const statusIcon = statusText.querySelector('i');
                
                if (isOnline) {
                    statusLabel.textContent = 'Online';
                    statusLabel.className = 'online-text';
                    statusIcon.className = 'bi bi-circle-fill mr-1 text-green-500';
                } else {
                    statusLabel.textContent = 'Offline';
                    statusLabel.className = 'offline-text';
                    statusIcon.className = 'bi bi-circle-fill mr-1 text-gray-500';
                }
                
                statusText.style.display = 'block';
            }
            
            updateLastSeenStatus() {
                const isOnline = this.friendData.isOnline || false;
                const lastSeenElement = document.getElementById('friendLastSeen');
                const lastSeenIcon = document.getElementById('lastSeenIcon');
                
                if (isOnline) {
                    lastSeenElement.textContent = 'Online now';
                    lastSeenIcon.className = 'bi bi-circle-fill mr-2 text-green-500';
                } else {
                    // You can use updated_at or last_seen field from API if available
                    const lastSeen = this.friendData.updated_at ? 
                        new Date(this.friendData.updated_at).toLocaleDateString() : 
                        'Recently';
                    lastSeenElement.textContent = `Last seen: ${lastSeen}`;
                    lastSeenIcon.className = 'bi bi-circle-fill mr-2 text-gray-500';
                }
            }
            
            updateRelationshipDisplay() {
                const statusElement = document.getElementById('relationshipStatus');
                const addBtn = document.getElementById('addFriendBtn');
                const removeBtn = document.getElementById('removeFriendBtn');
                const chatBtn = document.getElementById('chatBtn');
                const blockBtn = document.getElementById('blockBtn');
                const unblockBtn = document.getElementById('unblockBtn');
                
                // Hide all buttons first
                [addBtn, removeBtn, chatBtn, blockBtn, unblockBtn].forEach(btn => {
                    btn.style.display = 'none';
                });
                
                // Update based on relationship status
                switch (this.relationshipStatus) {
                    case 'friend':
                        statusElement.textContent = 'Friend';
                        statusElement.className = 'relationship-status status-friend';
                        removeBtn.style.display = 'inline-block';
                        chatBtn.style.display = 'inline-block';
                        blockBtn.style.display = 'inline-block';
                        break;
                        
                    case 'blocked':
                        statusElement.textContent = 'Blocked';
                        statusElement.className = 'relationship-status status-blocked';
                        unblockBtn.style.display = 'inline-block';
                        break;
                        
                    case 'pending':
                        statusElement.textContent = 'Request Pending';
                        statusElement.className = 'relationship-status status-pending';
                        blockBtn.style.display = 'inline-block';
                        break;
                        
                    default:
                        statusElement.textContent = 'No Relationship';
                        statusElement.className = 'relationship-status status-none';
                        addBtn.style.display = 'inline-block';
                        chatBtn.style.display = 'inline-block';
                        blockBtn.style.display = 'inline-block';
                        break;
                }
            }
            
            async sendFriendRequest() {
                try {
                    const response = await fetch(`${this.baseURL}/users/friends/request`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify({ receiverId: this.friendId })
                    });
                    
                    if (response.ok) {
                        this.showSuccess('Friend request sent successfully!');
                        this.relationshipStatus = 'pending';
                        this.updateRelationshipDisplay();
                    } else {
                        const errorText = await response.text();
                        this.showError(errorText || 'Failed to send friend request');
                    }
                } catch (error) {
                    console.error('Error sending friend request:', error);
                    this.showError('Failed to send friend request');
                }
            }
            
            async removeFriend() {
                if (!confirm('Are you sure you want to remove this friend?')) {
                    return;
                }
                
                try {
                    // Implementation would depend on your API structure
                    // This is a placeholder
                    this.showSuccess('Friend removed successfully!');
                    this.relationshipStatus = 'none';
                    this.updateRelationshipDisplay();
                } catch (error) {
                    console.error('Error removing friend:', error);
                    this.showError('Failed to remove friend');
                }
            }
            
            async startChat() {
                try {
                    // Create or get existing chat
                    const response = await fetch(`${this.baseURL}/chats/between/${this.friendId}`, {
                        credentials: 'include'
                    });
                    
                    let chatId;
                    if (response.ok) {
                        const chatData = await response.json();
                        chatId = chatData.chat_id;
                    } else if (response.status === 404) {
                        // Create new chat
                        const createResponse = await fetch(`${this.baseURL}/chats`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            credentials: 'include',
                            body: JSON.stringify({ user2Id: this.friendId })
                        });
                        
                        if (createResponse.ok) {
                            const newChat = await createResponse.json();
                            chatId = newChat.chat_id;
                        } else {
                            throw new Error('Failed to create chat');
                        }
                    } else {
                        throw new Error('Failed to get chat information');
                    }
                    
                    // Redirect to chat with the specific chat ID
                    window.location.href = `chat.html?chatId=${chatId}`;
                    
                } catch (error) {
                    console.error('Error starting chat:', error);
                    this.showError('Failed to start chat');
                }
            }
            
            async blockUser() {
                if (!confirm(`Are you sure you want to block ${this.friendData.username}?`)) {
                    return;
                }
                
                try {
                    const response = await fetch(`${this.baseURL}/users/blocks`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify({ blockRecipientId: this.friendId })
                    });
                    
                    if (response.ok) {
                        this.showSuccess('User blocked successfully!');
                        this.relationshipStatus = 'blocked';
                        this.updateRelationshipDisplay();
                    } else {
                        const errorText = await response.text();
                        this.showError(errorText || 'Failed to block user');
                    }
                } catch (error) {
                    console.error('Error blocking user:', error);
                    this.showError('Failed to block user');
                }
            }
            
            async unblockUser() {
                if (!confirm(`Are you sure you want to unblock ${this.friendData.username}?`)) {
                    return;
                }
                
                try {
                    const response = await fetch(`${this.baseURL}/users/blocks/${this.friendId}`, {
                        method: 'DELETE',
                        credentials: 'include'
                    });
                    
                    if (response.ok) {
                        this.showSuccess('User unblocked successfully!');
                        this.relationshipStatus = 'none';
                        this.updateRelationshipDisplay();
                    } else {
                        const errorText = await response.text();
                        this.showError(errorText || 'Failed to unblock user');
                    }
                } catch (error) {
                    console.error('Error unblocking user:', error);
                    this.showError('Failed to unblock user');
                }
            }
            
            showDetailedStats() {
                // Reuse logic from profile.ts but for friend data
                const modal = document.getElementById('friendDetailedStatsModal');
                const content = document.getElementById('friendDetailedStatsContent');
                
                if (!modal || !content) return;
                
                // Mock detailed stats for now
                content.innerHTML = `
                    <div class="cyber-container">
                        <h6 class="font-cyber text-cyber-blue text-lg mb-4">🎮 MATCH TYPES</h6>
                        <div class="space-y-3">
                            <div class="flex justify-between items-center p-3 bg-cyber-dark rounded">
                                <span class="text-white font-cyber">Regular Matches</span>
                                <span class="text-cyber-green font-cyber text-xl">${this.friendData.stats?.regular_matches || 0}</span>
                            </div>
                            <div class="flex justify-between items-center p-3 bg-cyber-dark rounded">
                                <span class="text-white font-cyber">AI Matches</span>
                                <span class="text-cyber-pink font-cyber text-xl">${this.friendData.stats?.ai_matches || 0}</span>
                            </div>
                            <div class="flex justify-between items-center p-3 bg-cyber-dark rounded">
                                <span class="text-white font-cyber">Tournament Matches</span>
                                <span class="text-purple-400 font-cyber text-xl">${this.friendData.stats?.tournament_matches || 0}</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="cyber-container">
                        <h6 class="font-cyber text-cyber-green text-lg mb-4">📊 PERFORMANCE</h6>
                        <div class="space-y-3">
                            <div class="flex justify-between items-center p-3 bg-cyber-dark rounded">
                                <span class="text-white font-cyber">Total Points Scored</span>
                                <span class="text-cyber-green font-cyber text-xl">${this.friendData.stats?.total_points || 0}</span>
                            </div>
                            <div class="flex justify-between items-center p-3 bg-cyber-dark rounded">
                                <span class="text-white font-cyber">Average Points/Game</span>
                                <span class="text-cyber-blue font-cyber text-xl">${this.friendData.stats?.avg_points || 0}</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="cyber-container">
                        <h6 class="font-cyber text-cyber-pink text-lg mb-4">🏆 ACHIEVEMENTS</h6>
                        <div class="space-y-3">
                            <div class="flex justify-between items-center p-3 bg-cyber-dark rounded">
                                <span class="text-white font-cyber">Tournaments Won</span>
                                <span class="text-cyber-green font-cyber text-xl">${this.friendData.stats?.tournaments_won || 0}</span>
                            </div>
                            <div class="flex justify-between items-center p-3 bg-cyber-dark rounded">
                                <span class="text-white font-cyber">Longest Win Streak</span>
                                <span class="text-cyber-blue font-cyber text-xl">${this.friendData.stats?.longest_streak || 0}</span>
                            </div>

                `;
                
                modal.classList.remove('hidden');
            }
            
            async showMatchHistory() {
                const modal = document.getElementById('friendMatchHistoryModal');
                const tbody = document.getElementById('friendMatchHistoryTable');
                
                if (!modal || !tbody) return;
                
                try {
                    // Load friend's match history
                    const response = await fetch(`${this.baseURL}/users/${this.friendId}/matches`, {
                        credentials: 'include'
                    });
                    
                    if (!response.ok) {
                        throw new Error('Failed to load match history');
                    }
                    
                    const matches = await response.json();
                    
                    tbody.innerHTML = '';
                    
                    if (matches.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="7" class="text-center py-6 text-gray-400">No match history available</td></tr>';
                    } else {
                        matches.forEach(match => {
                            const tr = document.createElement('tr');
                            
                            // Determine if friend won
                            const friendWon = match.player1_name === this.friendData.username ? 
                                match.player1_score > match.player2_score : 
                                match.player2_score > match.player1_score;
                            
                            if (friendWon) {
                                tr.classList.add('match-win');
                            } else {
                                tr.classList.add('match-loss');
                            }
                            
                            const matchType = match.match_type === 'tournament' ? 'Tournament' :
                                           match.match_type === '1vAi' ? 'vs AI' :
                                           match.match_type === 'multiplayer' ? 'Multiplayer' : '1v1';
                            
                            const opponent = match.player1_name === this.friendData.username ? 
                                match.player2_name : match.player1_name;
                            
                            const score = `${match.player1_score || 0} - ${match.player2_score || 0}`;
                            const result = friendWon ? '🏆 Win' : '❌ Loss';
                            
                            tr.innerHTML = `
                                <td class="px-4 py-3 text-sm">${new Date(match.created_at).toLocaleDateString()}</td>
                                <td class="px-4 py-3">${matchType}</td>
                                <td class="px-4 py-3">${match.player1_name}</td>
                                <td class="px-4 py-3">${opponent}</td>
                                <td class="px-4 py-3">${score}</td>
                                <td class="px-4 py-3">${result}</td>
                                <td class="px-4 py-3">${match.status}</td>
                            `;
                            
                            tbody.appendChild(tr);
                        });
                    }
                    
                    modal.classList.remove('hidden');
                    
                } catch (error) {
                    console.error('Error loading match history:', error);
                    tbody.innerHTML = '<tr><td colspan="7" class="text-center py-6 text-red-400">Error loading match history</td></tr>';
                    modal.classList.remove('hidden');
                }
            }
            
            goBackToChat() {
                // Go back to chat page
                window.location.href = 'chat.html';
            }
            
            showSuccess(message) {
                // Simple success notification
                const notification = document.createElement('div');
                notification.className = 'fixed top-4 right-4 bg-cyber-green text-cyber-dark px-6 py-3 rounded-lg font-cyber z-50';
                notification.textContent = message;
                document.body.appendChild(notification);
                
                setTimeout(() => {
                    notification.remove();
                }, 3000);
            }
            
            showError(message) {
                // Simple error notification
                const notification = document.createElement('div');
                notification.className = 'fixed top-4 right-4 bg-cyber-pink text-white px-6 py-3 rounded-lg font-cyber z-50';
                notification.textContent = message;
                document.body.appendChild(notification);
                
                setTimeout(() => {
                    notification.remove();
                }, 3000);
            }
        }
        
        // Initialize friend profile when DOM is loaded
        document.addEventListener('DOMContentLoaded', function() {
            new FriendProfile();
            document.body.style.visibility = 'visible';
            document.body.style.opacity = '1';
        });
    </script>
</div>
