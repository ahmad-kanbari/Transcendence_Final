<div class="chat-page">
    <!-- Skip to content link for accessibility -->
    <a href="#main-content" class="skip-to-content" data-i18n="chat.skipToContent" style="position: absolute; top: -50px; left: 0; padding: 8px 16px; background: var(--cyber-blue); color: var(--cyber-darker); z-index: 9999; transition: top 0.3s;">Skip to content</a>


    <!-- Floating Particles -->
    <div class="particles" id="particles"></div>

    <!-- Friend Action Popup (Hidden by default) -->
    <div id="friendSearchPopupOverlay" style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.7);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 1000;
        backdrop-filter: blur(5px);
    ">
        <div id="friendSearchPopup" style="
            background: #1a1a1a;
            border: 2px solid var(--cyber-blue, #00f);
            border-radius: 10px;
            padding: 30px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            position: relative;
            box-shadow: 0 20px 40px rgba(0, 255, 255, 0.3);
            animation: popupSlideIn 0.3s ease-out;
        ">
            <button id="friendSearchPopupCloseBtn" style="
                position: absolute;
                top: 10px;
                right: 15px;
                background: none;
                border: none;
                color: #999;
                font-size: 24px;
                cursor: pointer;
                padding: 0;
                width: 30px;
                height: 30px;
                display: flex;
                align-items: center;
                justify-content: center;
                transition: all 0.3s ease;
            ">&times;</button>
            
            <h3 style="
                color: var(--cyber-blue, #00f);
                margin-bottom: 10px;
                font-size: 24px;
            " data-i18n="chat.userActions">User Actions</h3>
            
            <p style="color: #ccc; margin-bottom: 30px;" data-i18n="chat.whatToDo">
                What would you like to do with 
                <strong id="friendSearchPopupUsername" style="color: var(--cyber-green, #0f0);"></strong>?
            </p>
            
            <div style="display: flex; gap: 15px; justify-content: center;">
                <button id="friendSearchPopupAddBtn" style="
                    background: linear-gradient(45deg, var(--cyber-green, #0f0), #00ff88);
                    color: #000;
                    border: none;
                    padding: 12px 24px;
                    border-radius: 25px;
                    cursor: pointer;
                    font-weight: bold;
                    font-size: 16px;
                    transition: all 0.3s ease;
                    flex: 1;
                    max-width: 120px;
                " data-i18n="chat.addFriend">Add Friend</button>
                
                <button id="friendSearchPopupBlockBtn" style="
                    background: linear-gradient(45deg, #ff0040, #ff4444);
                    color: white;
                    border: none;
                    padding: 12px 24px;
                    border-radius: 25px;
                    cursor: pointer;
                    font-weight: bold;
                    font-size: 16px;
                    transition: all 0.3s ease;
                    flex: 1;
                    max-width: 120px;
                " data-i18n="chat.blockUser">Block User</button>
            </div>
        </div>
    </div>

    <!-- Dashboard Stats View -->

         <button class="close-dashboard" id="closeDashboard">&times;</button>
        <h2 style="font-family: 'Orbitron', sans-serif; color: var(--cyber-blue); text-align: center; margin-bottom: 30px; font-size: 2rem; text-transform: uppercase; letter-spacing: 2px;">Dashboard Overview</h2> -->

    <div class="dashboard-container" id="main-content">
        <!-- Friends Management Sidebar -->
        <div class="sidebar">
            <h2 data-i18n="chat.friendManagement"> Friend Management</h2>

            <div class="section">
                <h3 data-i18n="chat.searchUser">Search User</h3>
                <!-- <input
                    type="text"
                    id="userSearch"
                    placeholder="Search for a friend..."
                    aria-label="Search for users"
                    data-i18n-attr="placeholder:chat.searchForFriend"
                />
                <ul id="userSearchResults" role="listbox" aria-label="Search results"></ul> -->
           <button 
                id="openFriendSearchBtn"
                style="
                    width: 100%;
                    padding: 12px 20px;
                    background: var(--cyber-blue, #05D9E8);;
                    color: #000;
                    border: 2px solid #00ffff;
                    border-radius: 8px;
                    cursor: pointer;
                    font-weight: bold;
                    font-size: 14px;
                    text-transform: uppercase;
                    letter-spacing: 1px;
                    transition: all 0.3s ease;
                    box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
                    position: relative;
                "
                data-i18n="chat.searchUser"
            >
                🔍 Search for Users
            </button>
            </div>

            <div class="section">
                <h3 data-i18n="chat.incomingRequests">Incoming Requests</h3>
                <ul id="incomingRequests" role="list" data-i18n-attr="placeholder:chat.incomingFrinedRequests" aria-label="Incoming friend requests"></ul>
            </div>

            <div class="section">
                <h3 data-i18n="chat.outgoingRequests">Outgoing Requests</h3>
                <ul id="outgoingRequests" role="list" data-i18n-attr="placeholder:chat.outgoingFrinedRequests" aria-label="Outgoing friend requests"></ul>
            </div>

            <div class="section">
                <h3 data-i18n="chat.friends">Friends</h3>
                <ul id="friendsList" role="list" data-i18n-attr="placeholder:chat.Frinedlists" aria-label="Friends list"></ul>
            </div>

            <!-- NEW: Blocked Users Section -->
            <div class="section">
                <h3 style="display: flex; align-items: center; gap: 10px;">
                    <span data-i18n="chat.blockedUsers">Blocked Users</span>
                    <span class="badge blocked-badge" id="blockedUsersBadge" style="
                        display: none; 
                        background: #ff4444; 
                        color: white; 
                        padding: 2px 8px; 
                        border-radius: 10px; 
                        font-size: 12px;
                        min-width: 20px;
                        text-align: center;
                    ">0</span>
                </h3>
                <ul id="blockedUsersList" role="list" aria-label="Blocked users list" style="
                    max-height: 200px;
                    overflow-y: auto;
                    list-style: none;
                    padding: 0;
                    margin: 0;
                "></ul>
            </div>
        </div>

        <!-- Main Chat Area -->
        <div class="main">
            <!-- Top Bar -->
            <div class="topbar">
                <h1 data-i18n="chat.cyberChat">Cyber Chat</h1>
                <!-- <div class="notifications-area">
                    <button class="dashboard-toggle" id="showDashboard">
                        <i class="bi bi-graph-up"></i><span data-i18n="chat.dashboard">Dashboard</span>
                    </button>
                </div> -->

                <!-- Mobile Sidebar Toggle Button -->
                <button class="mobile-sidebar-toggle" id="mobileSidebarToggle">
                    <i class="bi bi-list"></i>
                    <span data-i18n="chat.friendManagement">Friends</span>
                </button>

                <!-- Sidebar Overlay for Mobile -->
                <div class="sidebar-overlay" id="sidebarOverlay"></div>
            </div>
                  
            <!-- Chat Container -->
            <div class="chat-container">
                <!-- Chat List -->
                <div id="chatList" class="sidebar">
                    <div id="startChatArea">
                        <input
                            type="text"
                            id="userSearchInput"
                            placeholder="Start chat with..."
                            aria-label="Search users to start chat"
                             data-i18n-attr="placeholder:chat.startChatWith"
                        />
                        <div id="userSearchResultsChat" role="listbox" aria-label="User search results" style="display: none;"></div>
                    </div>
                    <h3 data-i18n="chat.yourChats">Your Chats</h3>
                    <div id="chatRows" role="list" aria-label="Active chats">
                        <!-- Chat rows will be populated by JavaScript -->
                    </div>
                </div>

                <!-- Chat Panel -->
                <div class="chatPanel">
                    <div id="chatHeader" role="banner" data-i18n="chat.selectChat">
                        Select a chat to start messaging
                    </div>
                    <div id="messageBox" role="log" aria-live="polite" aria-label="Chat messages">
                        <!-- Messages will be populated by JavaScript -->
                    </div>
                    <div class="messageInputArea">
                        <input
                            type="text"
                            id="messageInput"
                            placeholder="Type a message..."
                            aria-label="Message input"
                            data-i18n-attr="placeholder:chat.typeMessage"
                        />
                        <button id="sendBtn" aria-label="Send message">
                            <i class="bi bi-send"></i> <span data-i18n="chat.send">Send</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer" aria-live="polite" aria-atomic="true"></div>

    <style>
        /* Popup Animation */
        @keyframes popupSlideIn {
            from {
                transform: scale(0.7) translateY(-50px);
                opacity: 0;
            }
            to {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
        }
        
        /* Button Hover Effects */
        #friendSearchPopupAddBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 255, 0, 0.4);
        }
        
        #friendSearchPopupBlockBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 0, 64, 0.4);
        }
        
        #friendSearchPopupCloseBtn:hover {
            color: #fff;
            transform: rotate(90deg);
        }

        /* Blocked Users List Styling */
        #blockedUsersList li {
            padding: 8px;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 68, 68, 0.1);
            margin-bottom: 5px;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

        #blockedUsersList li:hover {
            background: rgba(255, 68, 68, 0.2);
        }

        #blockedUsersList .unblock-btn {
            padding: 4px 12px;
            background: #4CAF50;
            border: none;
            color: white;
            border-radius: 15px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s ease;
        }

        #blockedUsersList .unblock-btn:hover {
            background: #45a049;
            transform: translateY(-1px);
        }

        /* User info styling in blocked list */
        .blocked-user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .blocked-user-icon {
            color: #ff4444;
            font-size: 16px;
        }
    </style>
    <style>
#openFriendSearchBtn::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.1), transparent);
    transform: translateX(-100%);
    transition: transform 0.6s;
}

#openFriendSearchBtn:hover::before {
    transform: translateX(100%);
}

#openFriendSearchBtn:active {
    transform: scale(0.98) !important;
    box-shadow: 0 0 30px rgba(0, 255, 255, 0.8) !important;
}
</style>
</div>
