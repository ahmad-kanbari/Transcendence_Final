<div class="flex justify-center items-center min-h-[70vh]">
    <div class="w-full max-w-3xl">
        <div class="cyber-container p-6 md:p-8">
            <div class="text-center mb-8">
                <h2 class="cyber-heading text-3xl mb-4 animate-glow">Access Terminal</h2>
                <p class="cyber-text text-gray-300">Login or create a new account to track your scores and challenge friends</p>
            </div>
            
            <div class="auth-tabs mb-6">
                <div class="flex justify-center gap-4">
                    <button class="cyber-btn relative px-8 py-3 border-2 active" id="loginTab">
                        <span class="relative z-10">Login</span>
                    </button>
                    <button class="cyber-btn-pink relative px-8 py-3 border-2 opacity-70 hover:opacity-100" id="registerTab">
                        <span class="relative z-10">Register</span>
                    </button>
                </div>
            </div>
            
            <div class="tab-content">
                <!-- Login Form -->
                <div id="loginFormContainer" class="tab-pane fade show active">
                    <form id="loginForm" class="space-y-6">
                        <div class="mb-4">
                            <label for="loginUsername" class="font-cyber text-cyber-blue block mb-2">Username</label>
                            <input type="text" class="cyber-input w-full rounded" id="loginUsername" required autocomplete="username">
                            <div class="flex justify-end mt-1">
                                <small class="text-gray-400 char-count">0/25</small>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label for="loginPassword" class="font-cyber text-cyber-blue block mb-2">Password</label>
                            <input type="password" class="cyber-input w-full rounded" id="loginPassword" required autocomplete="current-password">
                            <div class="flex justify-end mt-1">
                                <small class="text-gray-400 char-count">0/25</small>
                            </div>
                        </div>
                        <div class="flex justify-end mb-6">
                            <button type="button" id="login42Link" class="cyber-btn-pink text-sm px-4 py-2">Login with 42</button>
                        </div>
                        <div class="w-full">
                            <button id="loginBtn" type="submit" class="cyber-btn w-full py-4 text-lg font-cyber tracking-widest">
                                <i class="bi bi-terminal mr-2"></i> Login
                            </button>
                        </div>
                    </form>
                </div>
                
                <!-- Register Form -->
                <div id="registerFormContainer" class="tab-pane fade">
                    <form id="registerForm" class="space-y-6">
                        <div class="mb-4">
                            <label for="registerUsername" class="font-cyber text-cyber-pink block mb-2">Username</label>
                            <input type="text" class="cyber-input w-full rounded" id="registerUsername" required autocomplete="username">
                            <div class="flex justify-end mt-1">
                                <small class="text-gray-400 char-count">0/25</small>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label for="registerEmail" class="font-cyber text-cyber-pink block mb-2">Email</label>
                            <input type="email" class="cyber-input w-full rounded" id="registerEmail" required autocomplete="email">
                            <div class="flex justify-end mt-1">
                                <small class="text-gray-400 char-count">0/50</small>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label for="registerPassword" class="font-cyber text-cyber-pink block mb-2">Password</label>
                            <input type="password" class="cyber-input w-full rounded" id="registerPassword" required autocomplete="new-password">
                            <div class="flex justify-end mt-1">
                                <small class="text-gray-400 char-count">0/25</small>
                            </div>
                        </div>
                        <div class="mb-6">
                            <label for="confirmPassword" class="font-cyber text-cyber-pink block mb-2">Confirm Password</label>
                            <input type="password" class="cyber-input w-full rounded" id="confirmPassword" required autocomplete="new-password">
                            <div id="passwordMatchStatus" class="text-sm mt-1"></div>
                            <div class="flex justify-end mt-1">
                                <small class="text-gray-400 char-count">0/25</small>
                            </div>
                        </div>
                        <div class="w-full">
                            <button id="registerFormButton" type="submit" class="cyber-btn-green w-full py-4 text-lg font-cyber tracking-widest">
                                <i class="bi bi-person-plus mr-2"></i> Create Account
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
