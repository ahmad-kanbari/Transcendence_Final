<!-- Enhanced Login/Register Interface with Cyberpunk Theme -->
<div class="flex justify-center items-center min-h-screen pt-20 pb-10 px-4 bg-black">
    <div class="w-full max-w-3xl relative">
      <!-- Cyberpunk Background Effects -->
      <div class="absolute inset-0 overflow-hidden rounded-lg">
        <div class="opacity-40" style="background-image: linear-gradient(rgba(0, 217, 255, 0.1) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 217, 255, 0.1) 1px, transparent 1px); background-size: 20px 20px;"></div>
        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-purple-600 via-cyan-400 to-purple-600"></div>
        <div class="absolute bottom-0 left-0 w-full h-1 bg-gradient-to-r from-purple-600 via-cyan-400 to-purple-600"></div>
        <div class="absolute top-1 left-0 w-1 h-full bg-gradient-to-b from-purple-600 via-cyan-400 to-purple-600"></div>
        <div class="absolute top-1 right-0 w-1 h-full bg-gradient-to-b from-purple-600 via-cyan-400 to-purple-600"></div>
      </div>
  
      <!-- Main Container -->
      <div class="relative border-2 border-cyan-400 bg-black bg-opacity-90 p-6 md:p-8 rounded-lg overflow-hidden z-10" style="box-shadow: 0 0 20px rgba(0, 217, 255, 0.3);">
        <!-- Header -->
        <div class="text-center mb-6">
          <h2 class="font-mono font-bold text-3xl mb-2 text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-pink-500 tracking-widest animate-pulse">ACCESS TERMINAL</h2>
          <p class="text-gray-300 text-sm md:text-base">Login or create a new account to track your scores and challenge friends</p>
        </div>
        
        <!-- Enhanced Tab Navigation -->
        <div class="auth-tabs mb-6">
          <div class="flex justify-center gap-2 md:gap-4">
            <button class="tab-active relative px-5 py-3 w-36 border-2 border-cyan-400 focus:outline-none focus:ring-2 focus:ring-cyan-400 bg-cyan-400 bg-opacity-10 opacity-100" id="loginTab" aria-selected="true" role="tab">
              <span class="relative z-10 font-mono font-bold tracking-wider text-cyan-400" style="text-shadow: 0 0 10px #00d9ff;">LOGIN</span>
              <div class="absolute bottom-0 left-0 w-full h-0.5 bg-cyan-400"></div>
            </button>
            <button class="relative px-5 py-3 w-36 border-2 border-pink-500 opacity-70 hover:opacity-100 transition-opacity duration-300 focus:outline-none focus:ring-2 focus:ring-pink-500" id="registerTab" aria-selected="false" role="tab">
              <span class="relative z-10 font-mono font-bold tracking-wider text-pink-500">REGISTER</span>
              <div class="absolute bottom-0 left-0 w-0 h-0.5 bg-pink-500 transition-all duration-300"></div>
            </button>
          </div>
        </div>
        
        <div class="tab-content">
          <!-- Login Form - Initially Visible -->
          <div id="loginFormContainer" class="tab-pane active" role="tabpanel" aria-labelledby="loginTab">
            <form id="loginForm" class="space-y-5">
              <div class="relative">
                <label for="loginUseremail" class="font-mono font-bold text-cyan-400 block mb-2 text-sm uppercase tracking-wider">Email</label>
                <div class="relative">
                  <div class="absolute left-0 top-0 bottom-0 w-1 bg-cyan-400"></div>
                  <input 
                    type="email" 
                    class="w-full bg-black border-2 border-cyan-400 px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-cyan-400 focus:border-transparent" 
                    style="box-shadow: 0 0 15px rgba(0, 217, 255, 0.5);"
                    id="loginUseremail" 
                    required 
                    autocomplete="email"
                    placeholder="Enter your email"
                  >
                  <div class="absolute right-0 top-0 bottom-0 w-1 bg-cyan-400"></div>
                </div>
                <div class="flex justify-end mt-1">
                  <small class="text-gray-400 char-count text-xs">0/25</small>
                </div>
              </div>
              
              <div class="relative">
                <label for="loginPassword" class="font-mono font-bold text-cyan-400 block mb-2 text-sm uppercase tracking-wider">Password</label>
                <div class="relative">
                  <div class="absolute left-0 top-0 bottom-0 w-1 bg-cyan-400"></div>
                  <input 
                    type="password" 
                    class="w-full bg-black border-2 border-cyan-400 px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-cyan-400 focus:border-transparent" 
                    style="box-shadow: 0 0 15px rgba(0, 217, 255, 0.5);"
                    id="loginPassword" 
                    required 
                    autocomplete="current-password"
                    placeholder="Enter your password"
                  >
                  <div class="absolute right-0 top-0 bottom-0 w-1 bg-cyan-400"></div>
                </div>
                <div class="flex justify-end mt-1">
                  <small class="text-gray-400 char-count text-xs">0/25</small>
                </div>
              </div>
              
              <div class="flex justify-end mb-2">
                <button 
                  type="button" 
                  id="login42Link" 
                  class="flex items-center bg-black border-2 border-pink-500 text-pink-500 hover:bg-pink-500 hover:text-black transition-colors duration-300 text-sm px-4 py-2 focus:outline-none focus:ring-2 focus:ring-pink-500"
                >
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 488 512" fill="currentColor" class="w-4 h-4 mr-2">
                    <path d="M488 261.8C488 403.3 391.1 504 248 504 110.8 504 0 393.2 0 256S110.8 8 248 8c66.8 0 123 24.5 166.3 64.9l-67.5 64.9C258.5 52.6 94.3 116.6 94.3 256c0 86.5 69.1 156.6 153.7 156.6 98.2 0 135-70.4 140.8-106.9H248v-85.3h236.1c2.3 12.7 3.9 24.9 3.9 41.4z"/>
                  </svg>
                  Login with Google
                </button>
              </div>
              
              <div class="w-full relative mt-6">
                <button 
                  id="loginBtn" 
                  type="submit" 
                  class="w-full py-4 bg-black border-2 border-cyan-400 text-lg font-mono font-bold tracking-widest text-cyan-400 hover:bg-cyan-400 hover:text-black transition-all duration-300 relative overflow-hidden focus:outline-none focus:ring-2 focus:ring-cyan-400 transform hover:-translate-y-0.5"
                  style="box-shadow: 0 5px 15px rgba(0, 217, 255, 0.4);"
                >
                  <span class="relative z-10 flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" class="w-5 h-5 mr-2">
                      <path d="M0 2a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V2zm5.5 10a.5.5 0 0 0 0-1H3V4.5a.5.5 0 0 0-1 0v7a.5.5 0 0 0 .5.5h3zm1-11a.5.5 0 0 0 0 1h2.5v2.5a.5.5 0 0 0 1 0v-3a.5.5 0 0 0-.5-.5h-3z"/>
                    </svg>
                    LOGIN
                  </span>
                </button>
              </div>
            </form>
          </div>

          <!-- Register Form - Initially Hidden -->
          <div id="registerFormContainer" class="tab-pane" role="tabpanel" aria-labelledby="registerTab">
            <form id="registerForm" class="space-y-5">
              <div class="relative">
                <label for="registerUsername" class="font-cyber text-cyber-pink block mb-2 text-sm uppercase tracking-wider">Username</label>
                <div class="relative">
                  <div class="absolute left-0 top-0 bottom-0 w-1 bg-cyber-pink"></div>
                  <input 
                    type="text" 
                    class="cyber-input w-full bg-cyber-dark border-2 border-cyber-pink px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-cyber-pink focus:border-transparent" 
                    id="registerUsername" 
                    required 
                    autocomplete="username"
                    placeholder="Choose a username"
                  >
                  <div class="absolute right-0 top-0 bottom-0 w-1 bg-cyber-pink"></div>
                </div>
                <div class="flex justify-end mt-1">
                  <small class="text-gray-400 char-count text-xs">0/25</small>
                </div>
              </div>
              
              <div class="relative">
                <label for="registerEmail" class="font-cyber text-cyber-pink block mb-2 text-sm uppercase tracking-wider">Email</label>
                <div class="relative">
                  <div class="absolute left-0 top-0 bottom-0 w-1 bg-cyber-pink"></div>
                  <input 
                    type="email" 
                    class="cyber-input w-full bg-cyber-dark border-2 border-cyber-pink px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-cyber-pink focus:border-transparent" 
                    id="registerEmail" 
                    required 
                    autocomplete="email"
                    placeholder="Enter your email"
                  >
                  <div class="absolute right-0 top-0 bottom-0 w-1 bg-cyber-pink"></div>
                </div>
                <div class="flex justify-end mt-1">
                  <small class="text-gray-400 char-count text-xs">0/50</small>
                </div>
              </div>
              
              <div class="relative">
                <label for="registerPassword" class="font-cyber text-cyber-pink block mb-2 text-sm uppercase tracking-wider">Password</label>
                <div class="relative">
                  <div class="absolute left-0 top-0 bottom-0 w-1 bg-cyber-pink"></div>
                  <input 
                    type="password" 
                    class="cyber-input w-full bg-cyber-dark border-2 border-cyber-pink px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-cyber-pink focus:border-transparent" 
                    id="registerPassword" 
                    required 
                    autocomplete="new-password"
                    placeholder="Create a password"
                  >
                  <div class="absolute right-0 top-0 bottom-0 w-1 bg-cyber-pink"></div>
                </div>
                <div class="flex justify-end mt-1">
                  <small class="text-gray-400 char-count text-xs">0/25</small>
                </div>
              </div>
              
              <div class="relative">
                <label for="confirmPassword" class="font-cyber text-cyber-pink block mb-2 text-sm uppercase tracking-wider">Confirm Password</label>
                <div class="relative">
                  <div class="absolute left-0 top-0 bottom-0 w-1 bg-cyber-pink"></div>
                  <input 
                    type="password" 
                    class="cyber-input w-full bg-cyber-dark border-2 border-cyber-pink px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-cyber-pink focus:border-transparent" 
                    id="confirmPassword" 
                    required 
                    autocomplete="new-password"
                    placeholder="Confirm your password"
                  >
                  <div class="absolute right-0 top-0 bottom-0 w-1 bg-cyber-pink"></div>
                </div>
                <div id="passwordMatchStatus" class="text-xs mt-1"></div>
                <div class="flex justify-end mt-1">
                  <small class="text-gray-400 char-count text-xs">0/25</small>
                </div>
              </div>
              
              <div class="w-full relative mt-6">
                <button 
                  id="registerFormButton" 
                  type="submit" 
                  class="cyber-btn-green w-full py-4 bg-cyber-dark border-2 border-cyber-green text-lg font-cyber tracking-widest text-cyber-green hover:bg-cyber-green hover:text-cyber-dark transition-colors duration-300 relative overflow-hidden focus:outline-none focus:ring-2 focus:ring-cyber-green"
                >
                  <span class="relative z-10 flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" class="w-5 h-5 mr-2">
                      <path d="M8 9a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm0-7a3 3 0 0 0-3 3v1H4a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-1V5a3 3 0 0 0-3-3z"/>
                    </svg>
                    CREATE ACCOUNT
                  </span>
                  <!-- Glitch effect -->
                  <span class="absolute inset-0 z-0 cyber-glitch-effect"></span>
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
</div>

<!-- 2FA Modal -->
<div id="twoFactorModal" class="fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center z-50 hidden">
  <div class="cyber-container bg-cyber-darker border-2 border-cyber-purple p-6 rounded-lg shadow-neon-blue max-w-md w-full mx-4">
    <!-- Modal Header -->
    <div class="text-center mb-6">
      <div class="mb-4">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-16 h-16 mx-auto text-cyber-purple">
          <path fill-rule="evenodd" d="M12 1.5a5.25 5.25 0 00-5.25 5.25v3a3 3 0 00-3 3v6.75a3 3 0 003 3h10.5a3 3 0 003-3V12.75a3 3 0 00-3-3v-3c0-2.9-2.35-5.25-5.25-5.25zm-3.75 8.25v-3a3.75 3.75 0 117.5 0v3h-7.5z" clip-rule="evenodd" />
        </svg>
      </div>
      <h3 class="font-cyber text-xl text-cyber-purple tracking-wider mb-2">TWO-FACTOR AUTHENTICATION</h3>
      <p class="text-gray-300 text-sm">Enter the 6-digit code from your authenticator app</p>
    </div>

    <!-- 2FA Form -->
    <form id="twoFactorForm" class="space-y-4">
      <div class="relative">
        <label for="totpCode" class="font-cyber text-cyber-purple block mb-2 text-sm uppercase tracking-wider">Verification Code</label>
        <div class="relative">
          <div class="absolute left-0 top-0 bottom-0 w-1 bg-cyber-purple"></div>
          <input 
            type="text" 
            class="code-input cyber-input w-full bg-cyber-dark border-2 border-cyber-purple px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-cyber-purple focus:border-transparent" 
            id="totpCode" 
            maxlength="6" 
            pattern="[0-9]*" 
            inputmode="numeric" 
            autocomplete="one-time-code" 
            placeholder="123456"
            required 
          >
          <div class="absolute right-0 top-0 bottom-0 w-1 bg-cyber-purple"></div>
        </div>
      </div>

      <!-- Error Message -->
      <div id="error2FA" class="error-message text-cyber-pink bg-cyber-dark border border-cyber-pink p-3 rounded text-sm" style="display: none;"></div>

      <!-- Submit Button -->
      <div class="flex gap-3 mt-6">
        <button 
          type="button" 
          id="twoFactorCloseBtn"
          class="flex-1 py-3 bg-cyber-dark border-2 border-gray-500 text-gray-300 font-cyber tracking-wider hover:bg-gray-700 transition-colors duration-300 focus:outline-none focus:ring-2 focus:ring-gray-500"
        >
          CANCEL
        </button>
        <button 
          type="submit" 
          id="twoFactorSubmitBtn"
          class="flex-1 py-3 bg-cyber-dark border-2 border-cyber-purple text-cyber-purple font-cyber tracking-wider hover:bg-cyber-purple hover:text-cyber-dark transition-colors duration-300 focus:outline-none focus:ring-2 focus:ring-cyber-purple"
        >
          VERIFY
        </button>
      </div>
    </form>
  </div>
</div>



<!-- Add a small script at the bottom to handle tab switching -->
<script>
  document.addEventListener('DOMContentLoaded', function() {
    // Get all necessary DOM elements
    const loginTab = document.getElementById('loginTab');
    const registerTab = document.getElementById('registerTab');
    const loginFormContainer = document.getElementById('loginFormContainer');
    const registerFormContainer = document.getElementById('registerFormContainer');
    
    console.log('DOM fully loaded and parsed');
    console.log('Elements found:', {
      loginTab,
      registerTab,
      loginFormContainer,
      registerFormContainer
    });

    // Handle tab switching - Login Tab
    loginTab.addEventListener('click', function() {
      console.log('Login tab clicked');
      
      // Update tab states
      loginTab.classList.add('tab-active');
      registerTab.classList.remove('tab-active');
      loginTab.setAttribute('aria-selected', 'true');
      registerTab.setAttribute('aria-selected', 'false');
      
      // Update form visibility - more direct approach
      loginFormContainer.style.display = 'block';
      registerFormContainer.style.display = 'none';
      
      // Also update classes for consistency
      loginFormContainer.classList.remove('hidden');
      registerFormContainer.classList.add('hidden');
    });

    // Handle tab switching - Register Tab
    registerTab.addEventListener('click', function() {
      console.log('Register tab clicked');
      
      // Update tab states
      registerTab.classList.add('tab-active');
      loginTab.classList.remove('tab-active');
      registerTab.setAttribute('aria-selected', 'true');
      loginTab.setAttribute('aria-selected', 'false');
      
      // Update form visibility - more direct approach
      loginFormContainer.style.display = 'none';
      registerFormContainer.style.display = 'block';
      
      // Also update classes for consistency
      registerFormContainer.classList.remove('hidden');
      loginFormContainer.classList.add('hidden');
    });
    
    // Character counter for input fields
    document.querySelectorAll('input[type="text"], input[type="email"], input[type="password"]').forEach(input => {
      const maxLength = input.id.includes('Email') ? 50 : 25;
      const counter = input.parentElement.parentElement.querySelector('.char-count');
      
      if (counter) {
        // Set initial count
        counter.textContent = `0/${maxLength}`;
        
        input.addEventListener('input', function() {
          const length = this.value.length;
          counter.textContent = `${length}/${maxLength}`;
          
          // Visual feedback when approaching limit
          if (length > maxLength * 0.8) {
            counter.classList.add('text-cyber-pink');
          } else {
            counter.classList.remove('text-cyber-pink');
          }
        });
      }
    });
    
    // Password match validation
    const registerPassword = document.getElementById('registerPassword');
    const confirmPassword = document.getElementById('confirmPassword');
    const passwordMatchStatus = document.getElementById('passwordMatchStatus');
    
    function checkPasswordMatch() {
      if (confirmPassword.value === '') {
        passwordMatchStatus.textContent = '';
        passwordMatchStatus.className = 'text-xs mt-1';
      } else if (registerPassword.value === confirmPassword.value) {
        passwordMatchStatus.textContent = 'Passwords match';
        passwordMatchStatus.className = 'text-xs mt-1 text-cyber-green';
      } else {
        passwordMatchStatus.textContent = 'Passwords do not match';
        passwordMatchStatus.className = 'text-xs mt-1 text-cyber-pink';
      }
    }
    
    // Add event listeners for password matching
    if (registerPassword && confirmPassword) {
      registerPassword.addEventListener('input', checkPasswordMatch);
      confirmPassword.addEventListener('input', checkPasswordMatch);
    }
  });
</script>
