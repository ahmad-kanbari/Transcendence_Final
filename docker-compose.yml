volumes:
  database-vol:
    name: database
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/database

  ssl-certs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${USER}/data/ssl-certs

networks:
  cyberpong-network:
    name: cyberpong-network

services:
  backend:
    build:
      context: ./srcs/backend
    container_name: backend
    image: backend-image
    volumes:
      - database-vol:/app/db
    env_file:
      - .env
    networks:
      - cyberpong-network

  frontend:
    build:
      context: ./srcs/frontend
    container_name: frontend
    image: frontend-image
    depends_on:
      - backend
    env_file:
      - .env
    networks:
      - cyberpong-network

  nginx:
    build: 
      context: ./srcs/nginx
    container_name: nginx
    image: nginx-image
    ports:
      - "443:443"
    depends_on:
      - backend
      - frontend
    volumes:
      - ssl-certs:/etc/ssl
    env_file:
      - .env
    networks:
      - cyberpong-network
