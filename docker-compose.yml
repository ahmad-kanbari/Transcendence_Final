version: '3.8'

services:
  backend:
    build:
      context: ./backend
    container_name: transcendence-backend
    restart: unless-stopped
    volumes:
      - ./backend/db:/app/db
    env_file:
      - .env
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
    container_name: transcendence-frontend
    depends_on:
      - backend
    env_file:
      - .env
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: transcendence-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend
    env_file:
      - .env
    networks:
      - app-network

networks:
  app-network:
    driver: bridge