networks:
  cyberpong-network:
    name: cyberpong-network

services:
  backend:
    build:
      context: ./srcs/backend
    container_name: backend
    image: backend-image
    volumes:
      - ./backend/db:/app/db
    env_file:
      - .env
    networks:
      - cyberpong-network

  frontend:
    build:
      context: ./srcs/frontend
    container_name: frontend
    image: frontend-image
    depends_on:
      - backend
    env_file:
      - .env
    networks:
      - cyberpong-network

  nginx:
    build: 
      context: ./srcs/nginx
    container_name: nginx
    image: nginx-image
    ports:
      - "443:443"
    depends_on:
      - backend
      - frontend
    volumes:
      ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    env_file:
      - .env
    networks:
      - cyberpong-network
